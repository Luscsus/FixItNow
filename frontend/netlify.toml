[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'sha256-BGLUbIw947w5SD/jR4WFBgqm4adJ1I7sYILodVWX+e4=' 'sha256-MltjvP5u3zdKPbScA1dH7xunMrVKjNJbr442ZkLghW0=' https://accounts.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob: https://*.tile.openstreetmap.org https://res.cloudinary.com https://randomuser.me;
      connect-src 'self' https://fix-it-now-backend-b27cce84b1a2.herokuapp.com wss://api.fixitnow.si https://generativelanguage.googleapis.com https://accounts.google.com;
      frame-src https://accounts.google.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    """
